name: Jira Automation Agent

on:
  pull_request:
    types: [opened, reopened, closed]

jobs:
  sync-jira:
    runs-on: ubuntu-latest
    steps:
      - name: Process PR Event for Jira
        uses: actions/github-script@v7
        env:
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const action = context.payload.action;
            const isMerged = pr.merged;

            // Extract Jira issue key from PR title or branch name (e.g., matches EALP-1, PROJ-123)
            const searchText = `${pr.title} ${pr.head.ref}`;
            const jiraKeyMatch = searchText.match(/[A-Z][A-Z0-9_]+-\d+/i);

            if (!jiraKeyMatch) {
              console.log('No Jira issue key found in PR title or branch name.');
              return;
            }

            const issueKey = jiraKeyMatch[0].toUpperCase();
            console.log(`Matched Jira Ticket: ${issueKey}`);

            // Jira API Setup
            const auth = Buffer.from(`${process.env.JIRA_USER_EMAIL}:${process.env.JIRA_API_TOKEN}`).toString('base64');
            const headers = {
              'Authorization': `Basic ${auth}`,
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            };

            async function jiraRequest(endpoint, method = 'GET', body = null) {
              const url = `https://${process.env.JIRA_DOMAIN}/rest/api/3/${endpoint}`;
              const res = await fetch(url, {
                method,
                headers,
                body: body ? JSON.stringify(body) : null
              });
              if (!res.ok) {
                const errText = await res.text();
                throw new Error(`Jira API Error [${res.status}]: ${errText}`);
              }
              return res.status !== 204 ? await res.json() : null;
            }

            async function transitionTicket(targetStatus) {
              const { transitions } = await jiraRequest(`issue/${issueKey}/transitions`);
              const target = transitions.find(t => t.name.toLowerCase() === targetStatus.toLowerCase());
              
              if (!target) {
                console.log(`Status "${targetStatus}" not available for ${issueKey}. Available states: ${transitions.map(t => t.name).join(', ')}`);
                return;
              }

              await jiraRequest(`issue/${issueKey}/transitions`, 'POST', {
                transition: { id: target.id }
              });
              console.log(`Successfully transitioned ${issueKey} to "${targetStatus}".`);
            }

            // --- TRIGGER 1: PR Created ---
            if (action === 'opened') {
              // 1. Link PR to Jira issue
              await jiraRequest(`issue/${issueKey}/remotelink`, 'POST', {
                object: {
                  url: pr.html_url,
                  title: `PR #${pr.number}: ${pr.title}`
                }
              });
              console.log(`Linked PR #${pr.number} to ${issueKey}`);

              // 2. Transition issue to "In Review"
              await transitionTicket('In Review');
            }

            // --- TRIGGER 2: PR Merged ---
            if (action === 'closed' && isMerged) {
              // Transition issue to "Done"
              await transitionTicket('Done');
            }